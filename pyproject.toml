[project]
name = "rocket-nozzle-cfd"
version = "0.1.0"
description = "Compressible CFD analysis of converging-diverging rocket nozzle"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "gmsh>=4.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nozzle", "src/cfd", "src/validation", "src/viz"]
