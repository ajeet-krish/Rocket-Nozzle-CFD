% ------- Rocket Nozzle CFD - Phase 0 Reference Case --------
% Converging-diverging nozzle, Euler, axisymmetric
% Chamber: 33.0 MPa, 3500K (air)
% Exit: 1 atm

SOLVER= EULER
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
AXISYMMETRIC= YES

% -------------------- GAS PROPERTIES ------------------------
GAMMA_VALUE= 1.4
GAS_CONSTANT= 287.058
SYSTEM_MEASUREMENTS= SI

% -------------------- BOUNDARY CONDITIONS -------------------
MARKER_EULER= ( wall )
MARKER_SYM= ( symmetry )

% Inlet: subsonic inlet with total conditions (Tt, Pt, Vx, Vy, Vz)
MARKER_INLET= ( inlet, 3500.0, 33000000.0, 1.0, 0.0, 0.0 )

% Outlet: static pressure
MARKER_OUTLET= ( outlet, 101325.0 )

% -------------------- NUMERICAL METHOD -----------------------
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= NO
TIME_DISCRE_FLOW= EULER_IMPLICIT

% -------------------- CONVERGENCE ----------------------------
ITER= 5000
CFL_NUMBER= 0.1
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.1, 1.5, 0.5, 20.0 )
CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= -6.0
CONV_STARTITER= 100

% -------------------- LINEAR SOLVER --------------------------
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 10

% -------------------- MULTIGRID --------------------------------
MGLEVEL= 0

% -------------------- OUTPUT -----------------------------------
SCREEN_OUTPUT= (INNER_ITER, RMS_DENSITY, MACH)
OUTPUT_FILES= (RESTART, PARAVIEW)
VOLUME_FILENAME= flow

MESH_FILENAME= nozzle.su2
